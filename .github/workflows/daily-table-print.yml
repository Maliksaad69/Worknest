name: Daily Database Table Report

'on':
  schedule:
    # Runs daily at 00:00 UTC (Midnight)
    - cron: '0 0 * * *'
  # Enables manual execution via GitHub Actions tab
  workflow_dispatch:
    inputs:
      table:
        description: 'Table name to print'
        required: false
        default: 'users'
        type: string
      limit:
        description: 'Maximum rows to fetch'
        required: false
        default: '50'
        type: string
      format:
        description: 'Table output style'
        required: false
        default: 'grid'
        type: choice
        options:
          - grid
          - github
          - psql
          - simple
          - json
          - csv

jobs:
  print-table:
    name: Print Database Table
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Table Printer Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mojslipqlkprjsmpvody.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          TABLE_NAME: ${{ github.event.inputs.table || 'users' }}
        run: |
          python scripts/print_users.py
